  product_service_db:
    container_name: "product-service-db"
    image: mongo:8.2.2
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: product_service_
      MONGO_INITDB_ROOT_PASSWORD: product_service_
      MONGO_INITDB_DATABASE: product_service_db
    ports:
      - "8002:27017"
    volumes:
      - product_service_db_data:/data/db

volumes:
  product_service_db_data:
